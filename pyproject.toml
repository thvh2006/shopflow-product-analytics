[project]
name = "shopflow-product-analytics"
version = "0.1.0"
description = "Product analytics and trustworthy experimentation portfolio case study"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb>=1.4,<2",
  "matplotlib>=3.10,<4",
  "numpy>=2.2,<3",
  "pandas>=2.2,<3",
  "pyarrow>=19,<24",
  "scipy>=1.15,<2",
  "seaborn>=0.13,<1",
  "statsmodels>=0.14,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
